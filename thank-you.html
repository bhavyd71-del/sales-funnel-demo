<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You're In! | Thank You</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Inter', sans-serif;
      background-color: #fafafa;
      color: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }
    .card {
      max-width: 460px;
      width: 100%;
      background: #ffffff;
      border: 1px solid #e5e5e5;
      border-radius: 12px;
      padding: 40px 24px;
      text-align: center;
    }
    .check-icon {
      width: 48px;
      height: 48px;
      background: #ecfdf5;
      color: #059669;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    p {
      font-size: 15px;
      color: #555;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .action-box {
      background: #f8fafc;
      border: 1px dashed #cbd5e1;
      border-radius: 8px;
      padding: 16px;
      font-size: 14px;
      color: #334155;
      text-align: left;
    }
    .action-box strong {
      display: block;
      margin-bottom: 4px;
      color: #0f172a;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="check-icon">✓</div>
    <h1>You're All Set!</h1>
    <p>We've just sent your confirmation details and download link directly to your inbox.</p>
    
    <div class="action-box">
      <strong>Next Step:</strong>
      Check your spam/promotions folder if you don't see it within 2 minutes, and whitelist our email address.
    </div>
  </div>
</body>
</html>
