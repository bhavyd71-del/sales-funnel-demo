<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Free Guide: The 1-Page Objection Buster Matrix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --text: #1a1a1a;
      --muted: #666666;
      --border: #eaeaea;
      --accent: #111111;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }
    .wrapper {
      max-width: 500px;
      width: 100%;
      text-align: center;
    }
    .tag {
      font-size: 13px;
      font-weight: 600;
      color: #64748b;
      margin-bottom: 12px;
      display: inline-block;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    h1 {
      font-size: 30px;
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: -0.02em;
      margin-bottom: 14px;
    }
    p.desc {
      font-size: 16px;
      color: var(--muted);
      margin-bottom: 28px;
      line-height: 1.5;
    }
    .box {
      border: 1px solid var(--border);
      background-color: #fafafa;
      border-radius: 12px;
      padding: 28px 24px;
      text-align: left;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    input {
      padding: 13px 14px;
      font-size: 15px;
      border: 1px solid #d4d4d4;
      border-radius: 8px;
      outline: none;
      background: #fff;
    }
    input:focus {
      border-color: var(--accent);
    }
    button {
      background: var(--accent);
      color: #fff;
      padding: 13px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }
    button:hover {
      opacity: 0.9;
    }
    .note {
      font-size: 12px;
      color: #888;
      text-align: center;
      margin-top: 14px;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <span class="tag">Free PDF Cheat Sheet</span>
    <h1>The 1-Page Objection Buster Matrix</h1>
    <p class="desc">Stop losing prospects to "Let me think about it." Get exact word-for-word responses for the 7 most common sales pushbacks.</p>
    
    <div class="box">
      <form onsubmit="event.preventDefault(); window.location.href='thank-you.html';">
        <input type="text" placeholder="Your Name" required />
        <input type="email" placeholder="Your Best Email" required />
        <button type="submit">Download The PDF Guide</button>
      </form>
      <div class="note">Instant access. Zero spam. Unsubscribe anytime.</div>
    </div>
  </div>
</body>
</html>
